name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: pip install -r icebeach-wakeclub/apps/api/requirements.txt
      - name: Run contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/icebeach-wakeclub
        run: python -m pytest icebeach-wakeclub/apps/api/tests -v

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icebeach-wakeclub/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  production-env-guard-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production env guard behavior
        run: bash scripts/server/test-production-env-guards.sh

  production-env-guard-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production env guard behavior
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\test-production-env-guards.ps1

  clean-release-tree-guard-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean release tree guard behavior
        run: bash scripts/server/test-clean-release-tree.sh

  clean-release-tree-guard-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean release tree guard behavior
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\test-clean-release-tree.ps1
