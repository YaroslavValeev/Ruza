<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ice Beach Mobile Game Preview</title>
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      color: #edf8ff;
      background:
        radial-gradient(circle at top left, rgba(89, 227, 255, 0.16), transparent 25%),
        radial-gradient(circle at top right, rgba(255, 180, 77, 0.18), transparent 18%),
        linear-gradient(180deg, #0b1324 0%, #07111f 56%, #0c1830 100%);
    }
    .frame {
      max-width: 420px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel, .card {
      border: 1px solid rgba(112, 188, 255, 0.22);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(15, 31, 55, 0.96) 0%, rgba(9, 19, 36, 0.98) 100%);
      box-shadow: 0 18px 45px rgba(0,0,0,0.32);
    }
    .panel { padding: 16px; margin-bottom: 14px; }
    .card { padding: 14px; margin-bottom: 12px; }
    .tabs, .ride { display: grid; gap: 8px; }
    .tabs { grid-template-columns: repeat(3, 1fr); }
    .ride { grid-template-columns: repeat(3, 1fr); }
    .tab, .ride-btn, .cta, .minor {
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid rgba(112, 188, 255, 0.18);
    }
    .tab, .minor {
      background: rgba(7, 16, 30, 0.94);
      color: rgba(233, 247, 255, 0.88);
    }
    .tab.active, .ride-btn.active {
      background: linear-gradient(180deg, rgba(89, 227, 255, 0.18) 0%, rgba(33, 92, 187, 0.42) 100%);
      border-color: rgba(89, 227, 255, 0.7);
      color: white;
    }
    .ride-btn { background: rgba(7, 16, 30, 0.94); }
    .cta {
      background: linear-gradient(180deg, #3fa9ff 0%, #1768ff 100%);
      color: white;
      border: none;
      margin-top: 10px;
    }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(196, 240, 255, 0.64); }
    .value { margin-top: 6px; font-size: 24px; font-weight: 900; }
    .grid { display: grid; gap: 10px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .chart {
      height: 180px;
      border-radius: 24px;
      background:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(180deg, rgba(11, 24, 44, 0.98) 0%, rgba(8, 18, 33, 0.98) 100%);
      background-size: 100% 33%, 18% 100%, auto;
      position: relative;
      overflow: hidden;
    }
    .bar {
      position: absolute;
      bottom: 20px;
      width: 30px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(180deg, #59e3ff 0%, #1768ff 100%);
    }
    .line {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
    .step { border-radius: 16px; padding: 10px 6px; text-align: center; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .step.on { background: rgba(89, 227, 255, 0.18); color: white; border: 1px solid rgba(89,227,255,0.4); }
    .step.off { background: rgba(7, 16, 30, 0.94); color: #668; border: 1px solid rgba(112,188,255,0.12); }
    h1,h2,p { margin: 0; }
    h1 { font-size: 28px; text-transform: uppercase; letter-spacing: 0.08em; }
    h2 { font-size: 22px; }
    .muted { color: rgba(220, 242, 255, 0.72); font-size: 14px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="panel">
      <h1>Ice Beach Club</h1>
      <p class="muted" style="margin-top:8px">Mobile-game стиль: крупные кнопки, последовательный flow, яркие статусы и быстрый контроль сезона.</p>
    </div>

    <div class="panel">
      <div class="tabs">
        <div class="tab">Аналитика</div>
        <div class="tab active">Брони</div>
        <div class="tab">Пилот</div>
      </div>
    </div>

    <div class="card">
      <div class="label">Шаги 2–4</div>
      <h2 style="margin-top:6px">Слот и экипировка</h2>
      <div class="grid stats" style="margin-top:14px">
        <div class="card" style="margin:0"><div class="label">Игрок</div><div class="value" style="font-size:16px">Ирина</div></div>
        <div class="card" style="margin:0"><div class="label">Слот</div><div class="value" style="font-size:16px">12:00 • boat_001</div></div>
      </div>
      <div class="ride" style="margin-top:12px">
        <div class="ride-btn">Вейкборд</div>
        <div class="ride-btn active">Серф</div>
        <div class="ride-btn">Ским</div>
      </div>
      <button class="cta">Запустить бронь</button>
    </div>

    <div class="card">
      <div class="label">Пилот</div>
      <h2 style="margin-top:6px">Очередь миссий</h2>
      <div class="progress">
        <div class="step on">Принят</div>
        <div class="step on">На базе</div>
        <div class="step on">Готов</div>
        <div class="step off">Вода</div>
        <div class="step off">Финиш</div>
      </div>
      <button class="cta">Шаг 3. Вывести на воду</button>
    </div>

    <div class="card">
      <div class="label">KPI</div>
      <h2 style="margin-top:6px">График сезона</h2>
      <div class="chart" style="margin-top:12px">
        <div class="bar" style="left:36px;height:50px"></div>
        <div class="bar" style="left:96px;height:90px"></div>
        <div class="bar" style="left:156px;height:70px"></div>
        <div class="bar" style="left:216px;height:120px"></div>
        <div class="bar" style="left:276px;height:80px"></div>
        <svg class="line" viewBox="0 0 360 180" preserveAspectRatio="none">
          <polyline fill="none" stroke="#ffb44d" stroke-width="4" points="50,120 110,90 170,105 230,60 290,95" />
          <circle cx="50" cy="120" r="5" fill="#ffb44d" />
          <circle cx="110" cy="90" r="5" fill="#ffb44d" />
          <circle cx="170" cy="105" r="5" fill="#ffb44d" />
          <circle cx="230" cy="60" r="5" fill="#ffb44d" />
          <circle cx="290" cy="95" r="5" fill="#ffb44d" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
